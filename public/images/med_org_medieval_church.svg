<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="church-title church-desc">
  <title id="church-title">The Medieval Catholic Church (c.1250–c.1500)</title>
  <desc id="church-desc">Heraldic museum emblem for the Medieval Catholic Church featuring a pointed Gothic cathedral arch, rose window, bishop's crosier, and illuminated Galen manuscript motif in slate, antique gold, and burgundy.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      svg, svg g { opacity: 1 !important; }
      .kicker { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 9.5px; font-weight: 800; letter-spacing: 1.8px; fill: #b45309; }
      .title { font-family: Georgia, 'Playfair Display', 'Times New Roman', serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
      .motto { font-family: Georgia, 'Playfair Display', 'Times New Roman', serif; font-size: 10.5px; font-style: italic; font-weight: 700; fill: #fef3c7; letter-spacing: 0.8px; }
      .sub-pill { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 9.5px; font-weight: 800; letter-spacing: 1.1px; fill: #7f1d1d; }
    ]]></style>
    <linearGradient id="vellumBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f5eedc"/>
    </linearGradient>
    <linearGradient id="burgundyShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="goldLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="emblemDrop" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1e293b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Crisp Museum Plaque Base -->
  <rect x="8" y="8" width="384" height="384" rx="22" fill="url(#vellumBg)" stroke="#d6cbb5" stroke-width="2"/>
  <rect x="18" y="18" width="364" height="364" rx="16" fill="none" stroke="#b45309" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Corner Illuminated Flourishes -->
  <g fill="none" stroke="#b45309" stroke-width="1.4" stroke-opacity="0.55">
    <path d="M 28 42 L 28 28 L 42 28"/><path d="M 372 42 L 372 28 L 358 28"/>
    <path d="M 28 358 L 28 372 L 42 372"/><path d="M 372 358 L 372 372 L 358 372"/>
  </g>

  <!-- Top Era Overline -->
  <text x="200" y="44" text-anchor="middle" class="kicker">INSTITUTIONAL AUTHORITY · c.1250–c.1500</text>

  <!-- Central Heraldic Shield and Gothic Cathedral Arch -->
  <g filter="url(#emblemDrop)">
    <!-- Slate Heraldic Backing Escutcheon -->
    <path d="M 104 64 L 296 64 L 296 196 C 296 254 246 286 200 304 C 154 286 104 254 104 196 Z" fill="#1e293b" stroke="url(#goldLeaf)" stroke-width="3.5"/>
    <!-- Inner Burgundy Gothic Lancet Arch -->
    <path d="M 124 194 L 124 142 C 124 102 162 78 200 72 C 238 78 276 102 276 142 L 276 194 C 276 240 236 268 200 284 C 164 268 124 240 124 194 Z" fill="url(#burgundyShield)" stroke="#fbbf24" stroke-width="2"/>
    <!-- Inner Gothic Tracery Arch -->
    <path d="M 140 192 L 140 146 C 140 114 168 94 200 88 C 232 94 260 114 260 146 L 260 192" fill="none" stroke="#fde68a" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>

  <!-- Gothic Rose Window at Arch Apex (cx=200, cy=128) -->
  <circle cx="200" cy="128" r="24" fill="#1e293b" stroke="#fbbf24" stroke-width="2.2"/>
  <circle cx="200" cy="128" r="17" fill="#7f1d1d" stroke="#fde68a" stroke-width="1"/>
  <g stroke="#fbbf24" stroke-width="1.3">
    <line x1="200" y1="104" x2="200" y2="152"/>
    <line x1="176" y1="128" x2="224" y2="128"/>
    <line x1="183" y1="111" x2="217" y2="145"/>
    <line x1="217" y1="111" x2="183" y2="145"/>
  </g>
  <circle cx="200" cy="128" r="5.5" fill="#fbbf24"/>

  <!-- Diagonal Gold Bishop's Crosier (Pastoral Staff) -->
  <g stroke="url(#goldLeaf)" stroke-linecap="round" fill="none">
    <line x1="168" y1="264" x2="226" y2="144" stroke-width="4.2"/>
    <!-- Spiral Volute Crook at Top -->
    <path d="M 226 144 C 236 124 214 110 202 122 C 194 130 202 142 212 138 C 218 135 216 128 211 128" stroke="#fde68a" stroke-width="3.4"/>
  </g>

  <!-- Illuminated Manuscript Book (Foreground Lower-Centre) -->
  <g transform="translate(200, 214)">
    <!-- Gold and Leather Book Cover -->
    <path d="M -52 -24 L -4 -18 L 4 -18 L 52 -24 L 52 28 L 4 34 L -4 34 L -52 28 Z" fill="#92400e" stroke="#fde68a" stroke-width="1.8"/>
    <!-- Left and Right Vellum Pages -->
    <path d="M -47 -20 Q -24 -24 -2 -16 L -2 29 Q -24 21 -47 24 Z" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <path d="M 47 -20 Q 24 -24 2 -16 L 2 29 Q 24 21 47 24 Z" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <!-- Illuminated Drop-Cap and Rubricated Manuscript Lines -->
    <rect x="-40" y="-12" width="13" height="14" rx="2" fill="#7f1d1d" stroke="#b45309" stroke-width="0.9"/>
    <text x="-33.5" y="-2" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#fde68a">G</text>
    <line x1="-23" y1="-9" x2="-8" y2="-8" stroke="#7f1d1d" stroke-width="1.6"/>
    <line x1="-23" y1="-2" x2="-8" y2="-1" stroke="#334155" stroke-width="1.4"/>
    <line x1="-40" y1="8" x2="-8" y2="9" stroke="#334155" stroke-width="1.4"/>
    <line x1="-40" y1="15" x2="-12" y2="16" stroke="#334155" stroke-width="1.4"/>
    <!-- Right Page Cross and Lines -->
    <line x1="24" y1="-11" x2="24" y2="3" stroke="#b45309" stroke-width="2.2"/>
    <line x1="18" y1="-5" x2="30" y2="-5" stroke="#b45309" stroke-width="2.2"/>
    <line x1="10" y1="10" x2="40" y2="9" stroke="#334155" stroke-width="1.4"/>
    <line x1="10" y1="17" x2="36" y2="16" stroke="#7f1d1d" stroke-width="1.4"/>
  </g>

  <!-- Heraldic Scroll Ribbon -->
  <rect x="74" y="294" width="252" height="28" rx="6" fill="#1e293b" stroke="#d97706" stroke-width="1.6"/>
  <text x="200" y="312" text-anchor="middle" class="motto">AUCTORITAS · FIDES · GALENUS</text>

  <!-- Museum Title and Role Footer -->
  <text x="200" y="346" text-anchor="middle" class="title">The Medieval Catholic Church</text>
  <rect x="78" y="356" width="244" height="20" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="200" y="370" text-anchor="middle" class="sub-pill">HOSPITALS · UNIVERSITIES · TRADITION</text>
</svg>
