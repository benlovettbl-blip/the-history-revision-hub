<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="rs-title rs-desc">
  <title id="rs-title">The Royal Society (Founded 1660 · Chartered 1662)</title>
  <desc id="rs-desc">Classical heraldic museum emblem for The Royal Society of London (founded Nov 1660; granted Royal Charter by King Charles II in 1662), featuring a Hooke compound microscope, brass telescope, open Philosophical Transactions volume, royal coronet, and the motto NULLIUS IN VERBA.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      svg, svg g { opacity: 1 !important; }
      .kicker { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 9.5px; font-weight: 800; letter-spacing: 1.8px; fill: #0f766e; }
      .title { font-family: Georgia, 'Playfair Display', 'Times New Roman', serif; font-size: 16.5px; font-weight: 700; fill: #0f172a; }
      .motto { font-family: Georgia, 'Playfair Display', 'Times New Roman', serif; font-size: 11.5px; font-weight: 700; letter-spacing: 2px; fill: #fde68a; }
      .sub-pill { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 9.5px; font-weight: 800; letter-spacing: 1px; fill: #115e59; }
    ]]></style>
    <linearGradient id="ivoryCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef5f3"/>
    </linearGradient>
    <linearGradient id="tealCrest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#115e59"/>
      <stop offset="55%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="crestDrop" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Museum Frame -->
  <rect x="8" y="8" width="384" height="384" rx="22" fill="url(#ivoryCard)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="18" y="18" width="364" height="364" rx="16" fill="none" stroke="#0f766e" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Top Era Overline -->
  <text x="200" y="42" text-anchor="middle" class="kicker">FOUNDED 1660 · ROYAL CHARTER 1662</text>

  <!-- Royal Charter Coronet Crown Above Shield -->
  <g transform="translate(200, 66)">
    <path d="M -32 10 L -26 -8 L -12 2 L 0 -12 L 12 2 L 26 -8 L 32 10 Z" fill="url(#brassGrad)" stroke="#0f172a" stroke-width="1.4"/>
    <rect x="-32" y="10" width="64" height="6" rx="2" fill="#d97706" stroke="#0f172a" stroke-width="1.2"/>
    <circle cx="-26" cy="-9" r="2.5" fill="#fde68a"/>
    <circle cx="0" cy="-13" r="3" fill="#fde68a"/>
    <circle cx="26" cy="-9" r="2.5" fill="#fde68a"/>
  </g>

  <!-- Classical Heraldic Shield -->
  <g filter="url(#crestDrop)">
    <path d="M 102 84 L 298 84 L 298 196 C 298 252 246 284 200 300 C 154 284 102 252 102 196 Z" fill="#0f172a" stroke="url(#brassGrad)" stroke-width="3.5"/>
    <path d="M 114 96 L 286 96 L 286 194 C 286 242 240 271 200 286 C 160 271 114 242 114 194 Z" fill="url(#tealCrest)" stroke="#5eead4" stroke-width="1.4" stroke-opacity="0.6"/>
  </g>

  <!-- Sunburst Rays of Empirical Observation -->
  <g stroke="#fde68a" stroke-opacity="0.28" stroke-width="1.4">
    <line x1="200" y1="104" x2="200" y2="148"/>
    <line x1="168" y1="110" x2="186" y2="150"/>
    <line x1="232" y1="110" x2="214" y2="150"/>
    <line x1="142" y1="126" x2="176" y2="156"/>
    <line x1="258" y1="126" x2="224" y2="156"/>
  </g>

  <!-- Crossed Brass Telescope (Left-to-Right) and Hooke Microscope (Left) -->
  <!-- Diagonal Brass Refracting Telescope -->
  <g transform="translate(218, 152) rotate(-32)">
    <rect x="-44" y="-6" width="54" height="12" rx="2" fill="url(#brassGrad)" stroke="#0f172a" stroke-width="1.3"/>
    <rect x="10" y="-4.5" width="32" height="9" rx="1.5" fill="#fde68a" stroke="#0f172a" stroke-width="1.2"/>
    <ellipse cx="-44" cy="0" rx="3" ry="6" fill="#bae6fd" stroke="#0f172a" stroke-width="1"/>
  </g>

  <!-- Robert Hooke 1665 Brass Compound Microscope (Left-Centre) -->
  <g transform="translate(166, 152)">
    <!-- Pillar and Base -->
    <line x1="-18" y1="-26" x2="-18" y2="34" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <rect x="-30" y="32" width="38" height="6" rx="2" fill="url(#brassGrad)" stroke="#0f172a" stroke-width="1.2"/>
    <!-- Tilted Microscope Barrel -->
    <g transform="rotate(16)">
      <rect x="-6" y="-28" width="16" height="38" rx="4" fill="url(#brassGrad)" stroke="#0f172a" stroke-width="1.4"/>
      <rect x="-9" y="-33" width="22" height="6" rx="2" fill="#0f172a"/>
      <rect x="-2" y="10" width="8" height="10" rx="1" fill="#fde68a" stroke="#0f172a" stroke-width="1.1"/>
    </g>
    <!-- Specimen Stage -->
    <line x1="-18" y1="18" x2="14" y2="18" stroke="#fde68a" stroke-width="2.5"/>
  </g>

  <!-- Open Book: Philosophical Transactions (1665) at Lower Shield -->
  <g transform="translate(200, 226)">
    <path d="M -54 -20 L -3 -14 L 3 -14 L 54 -20 L 54 24 L 3 30 L -3 30 L -54 24 Z" fill="#d97706" stroke="#0f172a" stroke-width="1.6"/>
    <path d="M -49 -16 Q -25 -20 -2 -12 L -2 26 Q -25 18 -49 20 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 49 -16 Q 25 -20 2 -12 L 2 26 Q 25 18 49 20 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Printed Scientific Diagrams and Lines -->
    <circle cx="-26" cy="2" r="9" fill="none" stroke="#0f766e" stroke-width="1.4"/>
    <line x1="-32" y1="2" x2="-20" y2="2" stroke="#0f766e" stroke-width="1"/>
    <line x1="-26" y1="-4" x2="-26" y2="8" stroke="#0f766e" stroke-width="1"/>
    <line x1="10" y1="-6" x2="40" y2="-7" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="10" y1="2" x2="40" y2="1" stroke="#0f766e" stroke-width="1.5"/>
    <line x1="10" y1="10" x2="36" y2="9" stroke="#0f172a" stroke-width="1.5"/>
    <text x="25" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="7.5" font-weight="700" fill="#b45309">1665</text>
  </g>

  <!-- Motto Ribbon: NULLIUS IN VERBA -->
  <rect x="68" y="294" width="264" height="28" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1.8"/>
  <text x="200" y="312" text-anchor="middle" class="motto">NULLIUS IN VERBA</text>

  <!-- Museum Title and Role Footer -->
  <text x="200" y="346" text-anchor="middle" class="title">The Royal Society (1660)</text>
  <rect x="66" y="356" width="268" height="20" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
  <text x="200" y="370" text-anchor="middle" class="sub-pill">EXPERIMENT · MICROGRAPHIA · PRINTING</text>
</svg>
