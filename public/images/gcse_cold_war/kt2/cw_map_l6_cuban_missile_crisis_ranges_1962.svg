<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-labelledby="cw-l6-title cw-l6-desc">
  <title id="cw-l6-title">The Cuban Missile Crisis: Soviet Missile Strike Ranges &amp; US Naval Quarantine (October 1962)</title>
  <desc id="cw-l6-desc">Edexcel GCSE History strategic map of the October 1962 Cuban Missile Crisis showing Cuba 90 miles south of Florida, the San Cristóbal missile site discovered by U-2 reconnaissance on 14 October 1962, concentric SS-4 MRBM (~1,000-mile) and SS-5 IRBM (~2,200-mile) nuclear strike arcs over Washington D.C., New York, and Chicago, President Kennedy’s 500-mile US Navy Quarantine Line, and Soviet freighters turning back on 24 October 1962.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      svg, svg g { opacity: 1 !important; }
      .banner-overline { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: 800; fill: #fbbf24; letter-spacing: 2px; }
      .banner-title { font-family: Georgia, 'Times New Roman', serif; font-size: 19px; font-weight: 700; fill: #ffffff; }
      .banner-pill-text { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: 800; fill: #fde68a; letter-spacing: 1px; }
      .country-lbl { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #475569; letter-spacing: 3px; paint-order: stroke fill; stroke: rgba(255,255,255,0.82); stroke-width: 3.4px; stroke-linejoin: round; }
      .sea-lbl { font-family: Georgia, 'Times New Roman', serif; font-size: 13px; font-style: italic; font-weight: 700; fill: #0369a1; letter-spacing: 1px; }
      .city-lbl { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; paint-order: stroke fill; stroke: #ffffff; stroke-width: 3.6px; stroke-linejoin: round; }
      .city-major { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #0f172a; paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .arc-lbl { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-size: 10.5px; font-weight: 800; paint-order: stroke fill; stroke: #ffffff; stroke-width: 3.6px; stroke-linejoin: round; }
      .card-hdr { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-size: 9.8px; font-weight: 800; fill: #fbbf24; letter-spacing: 1.1px; }
      .card-bold { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-size: 10.3px; font-weight: 800; fill: #0f172a; }
      .card-txt { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-size: 9.6px; font-weight: 600; fill: #334155; }
      .legend-txt { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-size: 10.5px; font-weight: 700; fill: #0f172a; }
      .legend-sub { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-size: 9.5px; font-weight: 500; fill: #475569; }
    ]]></style>
    <clipPath id="map-clip-l6">
      <rect x="0" y="62" width="880" height="500" />
    </clipPath>
    <filter id="card-shadow-l6" x="-8%" y="-8%" width="118%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- MAP VIEWPORT -->
  <g clip-path="url(#map-clip-l6)">
    <!-- Ocean Canvas -->
    <rect x="0" y="62" width="880" height="500" fill="#d8eefb" />

    <!-- Subtle Graticule -->
    <g stroke="#64748b" stroke-opacity="0.18" stroke-width="0.9" stroke-dasharray="4,4">
      <line x1="180" y1="62" x2="180" y2="562" />
      <line x1="360" y1="62" x2="360" y2="562" />
      <line x1="540" y1="62" x2="540" y2="562" />
      <line x1="720" y1="62" x2="720" y2="562" />
      <line x1="0" y1="168" x2="880" y2="168" />
      <line x1="0" y1="308" x2="880" y2="308" />
      <line x1="0" y1="448" x2="880" y2="448" />
    </g>

    <!-- ================= LANDMASSES ================= -->
    <!-- Canada (North) -->
    <path d="M 0,62 L 735,62 L 710,88 L 664,104 L 615,120 L 560,126 L 518,136 L 474,132 L 430,118 L 382,108 L 0,108 Z"
          fill="#e7e5df" stroke="#94a3b8" stroke-width="1.2" />

    <!-- United States of America (Blue-tinted NATO/US Homeland) -->
    <path d="M 0,108 L 382,108 L 430,118 L 474,132 L 518,136 L 560,126 L 615,120 L 664,104 L 682,118 L 656,144 L 622,162 L 602,178 L 586,204 L 580,234 L 552,268 L 528,302 L 524,344 L 516,374 L 498,378 L 486,348 L 472,320 L 444,312 L 408,318 L 382,322 L 342,326 L 308,344 L 292,374 L 268,366 L 238,334 L 196,318 L 146,304 L 92,282 L 42,248 L 0,210 Z"
          fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Great Lakes (Superior, Michigan, Huron, Erie, Ontario) -->
    <g fill="#bae6fd" stroke="#0284c7" stroke-width="0.9">
      <ellipse cx="426" cy="108" rx="28" ry="10" />
      <ellipse cx="446" cy="136" rx="9" ry="22" />
      <ellipse cx="474" cy="126" rx="14" ry="16" />
      <ellipse cx="504" cy="146" rx="16" ry="7" />
      <ellipse cx="534" cy="134" rx="14" ry="6" />
    </g>

    <!-- Mexico & Central America -->
    <path d="M 92,282 L 146,304 L 196,318 L 238,334 L 268,366 L 292,374 L 288,412 L 298,442 L 336,448 L 368,424 L 386,428 L 382,462 L 404,484 L 434,488 L 448,518 L 482,538 L 512,544 L 512,562 L 290,562 L 230,492 L 175,435 L 122,368 Z"
          fill="#ede9df" stroke="#94a3b8" stroke-width="1.2" stroke-linejoin="round" />

    <!-- South America (Northern Colombia/Venezuela edge) -->
    <path d="M 512,544 L 558,524 L 614,518 L 678,528 L 732,548 L 755,562 L 512,562 Z"
          fill="#ede9df" stroke="#94a3b8" stroke-width="1.2" />

    <!-- Hispaniola, Jamaica & Puerto Rico -->
    <path d="M 578,432 L 626,428 L 642,442 L 616,450 L 578,446 Z" fill="#ede9df" stroke="#94a3b8" stroke-width="1.1" />
    <ellipse cx="536" cy="458" rx="14" ry="5" fill="#ede9df" stroke="#94a3b8" stroke-width="1" />
    <rect x="658" y="438" width="22" height="8" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />

    <!-- CUBA (Crimson Highlight — Castro's Socialist Republic) -->
    <path d="M 432,418 C 454,404 484,402 516,408 C 542,414 562,424 572,432 C 554,436 532,432 508,424 C 484,418 456,420 432,424 Z"
          fill="#ef4444" stroke="#7f1d1d" stroke-width="2" stroke-linejoin="round" />

    <!-- ================= SOVIET NUCLEAR MISSILE STRIKE ARCS (Centered on San Cristóbal: 462, 412) ================= -->
    <!-- Outer Arc: SS-5 (R-14) IRBM (~2,200 miles, radius = 385px) -->
    <circle cx="462" cy="412" r="385" fill="#ef4444" fill-opacity="0.06" stroke="#b91c1c" stroke-width="2.4" stroke-dasharray="9,5" />

    <!-- Inner Arc: SS-4 (R-12) MRBM (~1,000–1,100 miles, radius = 236px — reaches Washington D.C.!) -->
    <circle cx="462" cy="412" r="236" fill="#ef4444" fill-opacity="0.11" stroke="#dc2626" stroke-width="2.6" stroke-dasharray="6,4" />

    <!-- Missile Trajectory Vectors from San Cristóbal -->
    <g stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3,3" opacity="0.7" fill="none">
      <line x1="462" y1="412" x2="572" y2="188" />
      <line x1="462" y1="412" x2="606" y2="158" />
      <line x1="462" y1="412" x2="432" y2="146" />
    </g>

    <!-- ================= KENNEDY'S 500-MILE US NAVY QUARANTINE LINE (22 OCT 1962) ================= -->
    <path d="M 538,342 C 594,348 638,382 652,434 C 656,458 648,482 632,500"
          fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" />
    <path d="M 538,342 C 594,348 638,382 652,434 C 656,458 648,482 632,500"
          fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-dasharray="8,5" stroke-linecap="round" />

    <!-- US Navy Warship Picket Markers along Quarantine Arc -->
    <g fill="#1e3a8a" stroke="#ffffff" stroke-width="1.4">
      <polygon points="576,353 585,357 576,361 567,357" />
      <polygon points="618,378 627,382 618,386 609,382" />
      <polygon points="644,414 653,418 644,422 635,418" />
      <polygon points="648,458 657,462 648,466 639,462" />
    </g>

    <!-- Approaching Soviet Missile Freighters Turning Back (24 October 1962) -->
    <g>
      <!-- Incoming track from USSR across Atlantic -->
      <path d="M 858,284 C 795,314 734,344 676,374" fill="none" stroke="#b91c1c" stroke-width="2.8" />
      <polygon points="676,374 687,374 682,365" fill="#b91c1c" />
      <!-- U-turn arrow (24 Oct 1962) -->
      <path d="M 676,374 C 664,382 670,398 690,394 L 748,374" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-dasharray="5,3" />
      <polygon points="748,374 737,373 741,382" fill="#b91c1c" />
      <!-- Ship Icon -->
      <circle cx="696" cy="364" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.6" />
      <text x="708" y="344" class="arc-lbl" fill="#991b1b">Soviet Missile Ships</text>
      <text x="708" y="357" class="city-lbl" font-size="9.8" fill="#7f1d1d">Stop &amp; turn back (24 Oct)</text>
    </g>

    <!-- ================= GEOGRAPHIC & RANGE LABELS ================= -->
    <text x="275" y="218" text-anchor="middle" class="country-lbl">UNITED STATES</text>
    <text x="195" y="92" text-anchor="middle" class="country-lbl">CANADA</text>
    <text x="220" y="376" text-anchor="middle" class="country-lbl">MEXICO</text>
    <text x="756" y="216" text-anchor="middle" class="sea-lbl">ATLANTIC OCEAN</text>
    <text x="414" y="368" text-anchor="middle" class="sea-lbl" font-size="11.5">Gulf of Mexico</text>
    <text x="532" y="492" text-anchor="middle" class="sea-lbl" font-size="11.5">Caribbean Sea</text>

    <!-- Arc Labels (Placed cleanly with zero overlap) -->
    <text x="295" y="138" text-anchor="middle" class="arc-lbl" fill="#991b1b">SS-5 IRBM RANGE (~2,200 MILES · 20 MIN FLIGHT)</text>
    <text x="355" y="246" text-anchor="middle" class="arc-lbl" fill="#dc2626">SS-4 MRBM RANGE (~1,000 MILES)</text>
    <text x="664" y="424" text-anchor="start" class="arc-lbl" fill="#1e3a8a">US Navy 500-Mile</text>
    <text x="664" y="437" text-anchor="start" class="arc-lbl" fill="#1e3a8a">Quarantine Line</text>

    <!-- ================= CITIES & BASES ================= -->
    <!-- San Cristóbal Missile Site -->
    <g transform="translate(458, 413)">
      <circle cx="0" cy="0" r="6" fill="#fbbf24" stroke="#7f1d1d" stroke-width="2.2" />
      <text x="-10" y="3" text-anchor="end" class="city-major" fill="#991b1b">San Cristóbal</text>
      <text x="-10" y="15" text-anchor="end" class="city-lbl" font-size="9.5" fill="#991b1b">U-2 photo discovery (14 Oct)</text>
    </g>

    <!-- Havana & Cuba label -->
    <circle cx="482" cy="407" r="3.8" fill="#ffffff" stroke="#7f1d1d" stroke-width="1.6" />
    <text x="484" y="432" text-anchor="middle" class="city-lbl">Havana</text>
    <text x="536" y="440" class="city-major" fill="#991b1b">CUBA</text>

    <!-- 90 Miles Florida Marker -->
    <line x1="498" y1="378" x2="492" y2="404" stroke="#0f172a" stroke-width="1.8" />
    <rect x="506" y="378" width="74" height="17" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.1" />
    <text x="543" y="390" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="9.5" font-weight="800" fill="#92400e">90 MILES</text>

    <!-- US Cities -->
    <g fill="#0f172a">
      <!-- Miami -->
      <circle cx="516" cy="368" r="3.8" stroke="#ffffff" stroke-width="1.4" />
      <text x="524" y="368" class="city-lbl">Miami (Florida)</text>

      <!-- New Orleans -->
      <circle cx="398" cy="316" r="3.8" stroke="#ffffff" stroke-width="1.4" />
      <text x="398" y="308" text-anchor="middle" class="city-lbl">New Orleans</text>

      <!-- Houston -->
      <circle cx="332" cy="322" r="3.8" stroke="#ffffff" stroke-width="1.4" />
      <text x="332" y="314" text-anchor="middle" class="city-lbl">Houston</text>

      <!-- Atlanta -->
      <circle cx="476" cy="272" r="3.8" stroke="#ffffff" stroke-width="1.4" />
      <text x="484" y="276" class="city-lbl">Atlanta</text>

      <!-- Washington, D.C. -->
      <circle cx="572" cy="188" r="5.2" fill="#dc2626" stroke="#ffffff" stroke-width="1.8" />
      <text x="582" y="193" class="city-major">Washington, D.C. (~12 mins)</text>

      <!-- New York -->
      <circle cx="606" cy="158" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.6" />
      <text x="616" y="162" class="city-major">New York</text>

      <!-- Chicago -->
      <circle cx="432" cy="146" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.6" />
      <text x="424" y="150" text-anchor="end" class="city-major">Chicago</text>

      <!-- Denver -->
      <circle cx="212" cy="182" r="3.8" stroke="#ffffff" stroke-width="1.4" />
      <text x="212" y="174" text-anchor="middle" class="city-lbl">Denver</text>
    </g>

    <!-- ================= EDEXCEL EXAM TAKEAWAY CARD (Bottom-Left) ================= -->
    <g filter="url(#card-shadow-l6)">
      <rect x="12" y="384" width="268" height="166" rx="7" fill="#ffffff" fill-opacity="0.96" stroke="#cbd5e1" stroke-width="1.3" />
      <rect x="12" y="384" width="268" height="25" rx="7" fill="#0f172a" />
      <rect x="12" y="399" width="268" height="10" fill="#0f172a" />
      <text x="23" y="401" class="card-hdr">THE THIRTEEN DAYS (14–28 OCT 1962)</text>

      <text x="23" y="424" class="card-bold" fill="#991b1b">Why Cuba Alarmed Kennedy &amp; ExComm:</text>
      <text x="23" y="437" class="card-txt">Missiles 90 miles off Florida cut US nuclear</text>
      <text x="23" y="450" class="card-txt">warning time to ~10–15 mins across major cities.</text>

      <text x="23" y="468" class="card-bold" fill="#1e3a8a">22 Oct Quarantine (DEFCON 2):</text>
      <text x="23" y="481" class="card-txt">Stopped Soviet ships without immediate war.</text>

      <text x="23" y="499" class="card-bold" fill="#065f46">28 Oct Compromise &amp; Thaw:</text>
      <text x="23" y="512" class="card-txt">USSR removed Cuban missiles for US non-invasion</text>
      <text x="23" y="525" class="card-txt">pledge + secret removal of US Jupiter missiles in</text>
      <text x="23" y="538" class="card-txt">Turkey → 1963 Hotline &amp; Test Ban Treaty.</text>
    </g>
  </g>

  <!-- Neatline -->
  <rect x="0.5" y="62" width="879" height="500" fill="none" stroke="#334155" stroke-width="1" />

  <!-- TOP HEADER BAR -->
  <g id="atlas-header-l6">
    <rect x="0" y="0" width="880" height="62" fill="#0f172a" />
    <line x1="0" y1="61" x2="880" y2="61" stroke="#f59e0b" stroke-width="2" />
    <text x="20" y="22" class="banner-overline">EDEXCEL GCSE HISTORY · SUPERPOWER RELATIONS (KT 2.2)</text>
    <text x="20" y="46" class="banner-title">The Cuban Missile Crisis: Strike Ranges &amp; Naval Quarantine</text>
    <rect x="720" y="17" width="140" height="28" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2" />
    <text x="790" y="35" text-anchor="middle" class="banner-pill-text">OCTOBER 1962</text>
  </g>

  <!-- BOTTOM LEGEND STRIP -->
  <g id="atlas-legend-l6">
    <rect x="0" y="562" width="880" height="78" fill="#f8fafc" />
    <line x1="0" y1="562" x2="880" y2="562" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Swatch 1 -->
    <circle cx="29" cy="583" r="6" fill="#fbbf24" stroke="#7f1d1d" stroke-width="2" />
    <text x="43" y="586" class="legend-txt">San Cristóbal Missile Base</text>
    <text x="43" y="598" class="legend-sub">Spotted by US U-2 (14 Oct 1962)</text>

    <!-- Swatch 2 -->
    <line x1="226" y1="582" x2="254" y2="582" stroke="#dc2626" stroke-width="2.6" stroke-dasharray="6,4" />
    <text x="262" y="586" class="legend-txt">SS-4 MRBM &amp; SS-5 IRBM Arcs</text>
    <text x="262" y="598" class="legend-sub">~1,000-mile &amp; ~2,200-mile strike radii</text>

    <!-- Swatch 3 -->
    <line x1="472" y1="582" x2="500" y2="582" stroke="#1d4ed8" stroke-width="3.6" stroke-dasharray="7,4" />
    <text x="508" y="586" class="legend-txt">500-Mile Naval Quarantine</text>
    <text x="508" y="598" class="legend-sub">Ordered by JFK on 22 Oct 1962</text>

    <!-- Swatch 4 -->
    <line x1="680" y1="582" x2="706" y2="582" stroke="#b91c1c" stroke-width="2.6" />
    <polygon points="706,582 698,578 698,586" fill="#b91c1c" />
    <text x="714" y="586" class="legend-txt">Soviet Ships Turn Back</text>
    <text x="714" y="598" class="legend-sub">Khrushchev halts ships (24 Oct)</text>

    <text x="20" y="624" class="legend-sub" font-weight="700" fill="#334155">Strategic Balance Note: Khrushchev deployed missiles to defend Castro after the Bay of Pigs (Apr 1961) and counter US Jupiter missiles in Turkey &amp; Italy.</text>
  </g>
</svg>
