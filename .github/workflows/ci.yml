name: CI Quality & Cloudflare Build Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality_and_build:
    name: Neutrality, Provenance, Curriculum & Cloudflare Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Institutional Neutrality & Sanitization Gate
        run: node scripts/verify_sanitization.cjs

      - name: Visual Integrity, Provenance & Zero-AI Gate
        run: |
          node scripts/verify_images.cjs
          node scripts/audit_provenance_and_ai.cjs
          node scripts/lint_source_fidelity.cjs
          node scripts/audit_infographics.cjs

      - name: Stage Answerability, Do Now & Retrieval Companion Gate
        run: |
          node scripts/audit_narrative_question_answerability.cjs --strict
          node scripts/audit_donow_grounding.cjs
          node scripts/audit_all_retrieval_companions.cjs

      - name: Production Vite Build, Cloudflare Edge Limits & SEO Parity Gate
        run: |
          npm run build
          node scripts/verify_cloudflare_and_seo.mjs
