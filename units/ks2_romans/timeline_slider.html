<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Stage 2 Romans in Britain Chronology Slider (450 BC–AD 410) • The History Revision Hub</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="Interactive horizontal chronology slider for Key Stage 2 The Romans in Britain (450 BC–AD 410). Designed for classroom whiteboards and pupil tablets.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,600;1,400&family=Outfit:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-app-header {
      background: #091224;
      color: #ffffff;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .brand-logo-badge {
      background: #b45309;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.04em;
    }
    .header-nav-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .nav-btn-link {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .nav-btn-link:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border-color: #ffffff;
    }
    #slider-mount-point { flex: 1; width: 100%; }
    :fullscreen { background: #f8fafc; overflow-y: auto; }
  </style>
</head>
<body>
  <header class="top-app-header">
    <div class="brand-group">
      <span class="brand-logo-badge">Key Stage 2 • Years 3–5</span>
      <span class="brand-title">The History Revision Hub</span>
      <span style="color: #64748b; font-size: 0.8rem;">|</span>
      <span style="font-size: 0.8rem; color: #cbd5e1; font-weight: 600;">Romans in Britain Chronology Slider (450 BC–AD 410)</span>
    </div>
    <div class="header-nav-actions">
      <a href="/?view=lessons&unit=ks2_romans" class="nav-btn-link">
        <i class="fa-solid fa-arrow-left"></i> Back to KS2 Unit Hub
      </a>
      <a href="textbook.html" target="_blank" class="nav-btn-link">
        <i class="fa-solid fa-book-open"></i> 12-Page Textbook
      </a>
      <a href="pupil_workbook.html" target="_blank" class="nav-btn-link">
        <i class="fa-solid fa-pencil"></i> 16-Page Workbook
      </a>
      <a href="ks2_romans_scheme_of_work.html" target="_blank" class="nav-btn-link">
        <i class="fa-solid fa-chalkboard-user"></i> Teacher Guide
      </a>
      <button id="btn-fullscreen-toggle" class="nav-btn-link" title="Toggle Fullscreen for Whiteboard Presentation">
        <i class="fa-solid fa-expand"></i> Whiteboard Mode
      </button>
    </div>
  </header>

  <main id="slider-mount-point"></main>

  <script type="module">
    import { renderKs2RomansTimelineSlider } from './timeline_slider_app.js';
    const container = document.getElementById('slider-mount-point');
    renderKs2RomansTimelineSlider(container);

    const fsBtn = document.getElementById('btn-fullscreen-toggle');
    if (fsBtn) {
      fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          fsBtn.innerHTML = '<i class="fa-solid fa-compress"></i> Exit Fullscreen';
        } else {
          document.exitFullscreen().catch(() => {});
          fsBtn.innerHTML = '<i class="fa-solid fa-expand"></i> Whiteboard Mode';
        }
      });
      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
          fsBtn.innerHTML = '<i class="fa-solid fa-expand"></i> Whiteboard Mode';
        }
      });
    }
  </script>
</body>
</html>
